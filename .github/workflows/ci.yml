name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build GlassLedge.slnx -c Release

      - name: Unit tests
        run: dotnet test GlassLedge.slnx -c Release --no-build --filter "Category!=Smoke&Category!=E2E" --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build GlassLedge.slnx -c Release

      - name: Smoke tests
        run: dotnet test tests/GlassLedge.Smoke/GlassLedge.Smoke.csproj -c Release --no-build --logger trx --results-directory TestResults-Smoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-smoke
          path: TestResults-Smoke

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build GlassLedge.slnx -c Release

      # These tests drive the real app's UI on a shared runner, where window focus and timing vary from run
      # to run. Retry the whole step up to three times so a one-off hiccup doesn't fail the check; a test
      # that fails every time still does.
      - name: End-to-end tests
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            Write-Host "E2E attempt $attempt of 3"
            dotnet test tests/GlassLedge.E2E/GlassLedge.E2E.csproj -c Release --no-build --logger trx --results-directory "TestResults-E2E/attempt-$attempt"
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e
          path: TestResults-E2E
